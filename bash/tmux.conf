# ============================================================
# PREFIX
# ============================================================
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ============================================================
# CORE SETTINGS
# ============================================================
set -g default-terminal "screen-256color"
set -s escape-time 0
set -g history-limit 30000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g aggressive-resize on

# ============================================================
# MOUSE
# ============================================================
set -g mouse on

# ============================================================
# VI KEY BINDINGS
# ============================================================
set-option -g status-keys vi
set-window-option -g mode-keys vi

# Copy mode — v/V/Ctrl-v mirror vim visual modes
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# ============================================================
# SPLITS & WINDOWS
# Open new splits in the current pane's working directory
# ============================================================
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window   -c "#{pane_current_path}"
unbind '"'
unbind %

# ============================================================
# PLUGINS  (managed by TPM)
# Install TPM first:
#   git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# Then reload config and press prefix + I to install plugins.
# ============================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'arcticicestudio/nord-tmux'

# ============================================================
# PLUGIN SETTINGS
# ============================================================

# resurrect — restore pane contents as well as layout
set -g @resurrect-capture-pane-contents 'on'

# continuum — auto-save every 15 min; restore on tmux server start
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# ============================================================
# VIMRC NOTE
# vim-tmux-navigator requires these lines in ~/.vimrc:
#
#   let g:tmux_navigator_no_mappings = 1
#   nnoremap <silent> <C-h> :TmuxNavigateLeft<CR>
#   nnoremap <silent> <C-j> :TmuxNavigateDown<CR>
#   nnoremap <silent> <C-k> :TmuxNavigateUp<CR>
#   nnoremap <silent> <C-l> :TmuxNavigateRight<CR>
# ============================================================

# ============================================================
# INITIALIZE TPM — must stay at the very end of this file
# ============================================================
run '~/.tmux/plugins/tpm/tpm'
