# ============================================================
# PREFIX
# ============================================================
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ============================================================
# CORE SETTINGS
# ============================================================
set -g default-terminal "screen-256color"   # macOS ncurses may lack tmux-256color
set -as terminal-features ",xterm*:RGB"   # true color
set -s escape-time 0
set -g history-limit 100000                # long Claude Code transcripts
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g aggressive-resize on

# ============================================================
# MOUSE
# ============================================================
set -g mouse on

# ============================================================
# VI KEY BINDINGS
# ============================================================
set-option -g status-keys vi
set-window-option -g mode-keys vi

# Copy mode — v/V/Ctrl-v mirror vim visual modes
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# ============================================================
# SPLITS & WINDOWS
# Open new splits in the current pane's working directory
# ============================================================
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window   -c "#{pane_current_path}"
unbind '"'
unbind %

# ============================================================
# CLAUDE CODE
# ============================================================
# Pass modified keys (Shift+Enter = newline in Claude's prompt) through
set -s extended-keys on
set -as terminal-features ",xterm*:extkeys"

# Window names follow the project folder, not the running process
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'

# "Claude needs you": with Claude's /config notification set to terminal bell,
# a waiting window lights up yellow in the status bar (style set after TPM below)
set -g monitor-bell on
set -g bell-action other
set -g visual-bell off

# prefix + C : prompt for a project path -> new window running claude
bind C command-prompt -p "project dir:" "new-window -c '%1' ; send-keys 'claude' Enter"
# prefix + S : new named session
bind S command-prompt -p "new session:" "new-session -s '%1'"
# prefix + r : reload this file
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"
# prefix + H/J/K/L : resize panes (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ============================================================
# PLUGINS  (managed by TPM)
# Install TPM first:
#   git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# Then reload config and press prefix + I to install plugins.
# ============================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'arcticicestudio/nord-tmux'

# ============================================================
# PLUGIN SETTINGS
# ============================================================

# resurrect — restore pane contents as well as layout
set -g @resurrect-capture-pane-contents 'on'

# continuum — auto-save every 15 min; restore on tmux server start
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# ============================================================
# VIMRC NOTE
# vim-tmux-navigator requires these lines in ~/.vimrc:
#
#   let g:tmux_navigator_no_mappings = 1
#   nnoremap <silent> <C-h> :TmuxNavigateLeft<CR>
#   nnoremap <silent> <C-j> :TmuxNavigateDown<CR>
#   nnoremap <silent> <C-k> :TmuxNavigateUp<CR>
#   nnoremap <silent> <C-l> :TmuxNavigateRight<CR>
# ============================================================

# ============================================================
# INITIALIZE TPM — must stay at the very end of this file
# ============================================================
run '~/.tmux/plugins/tpm/tpm'

# ============================================================
# AFTER TPM — overrides the Nord theme's window tabs
# ============================================================
setw -g window-status-bell-style 'fg=black,bg=yellow,bold'

# Claude Code state per window, set by bash/claude-tmux-state via Claude hooks.
# Nord palette (terminal colors): blue = working, yellow = needs you, green = done
#   other windows:   tab background = state color (grey when idle / not Claude)
#   current window:  Nord cyan tab + state icon
setw -g window-status-format \
  "#[fg=#{?#{@claude_state},black,white},bg=#{?#{==:#{@claude_state},waiting},yellow,#{?#{==:#{@claude_state},done},green,#{?#{==:#{@claude_state},working},blue,brightblack}}}] #I #W#{?#{==:#{@claude_state},waiting}, !,}#{?#{==:#{@claude_state},done}, ✓,}#{?#{==:#{@claude_state},working}, …,} #[default] "
setw -g window-status-current-format \
  "#[fg=black,bg=cyan,bold] #I #W#{?#{==:#{@claude_state},waiting}, !,}#{?#{==:#{@claude_state},done}, ✓,}#{?#{==:#{@claude_state},working}, …,} #[default] "

# "done" (green) clears once you visit that window; "waiting" stays until answered
set-hook -g session-window-changed 'if -F "#{==:#{@claude_state},done}" "set -w @claude_state idle"'
